<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>考勤审批</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="approval.css">
    <script src="approval.js"></script>
</head>
<body>
    <div class="container approval-page">
        <!-- Header -->
        <header class="approval-header">
            <h2 class="greeting">尊敬的管理者您好：</h2>
            <a href="index.html" class="back-link">返回首页</a>
        </header>
        <h1 class="page-title">审批表</h1>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value">5</div>
                <div class="stat-label">本月待审</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">12</div>
                <div class="stat-label">本月已审</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">0%</div>
                <div class="stat-label">部门异常打卡比率</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <button class="batch-select-btn">批量<br>选择</button>
            <div class="filter-tabs">
                <button class="filter-tab active">全部</button>
                <button class="filter-tab">待审批</button>
                <button class="filter-tab">已批准</button>
            </div>
            <div class="filter-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </div>
        </div>

        <!-- Approval List -->
        <div class="approval-list">
            <!-- User 01 -->
            <div class="approval-item">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="user01">
                    <label for="user01"></label>
                </div>
                <div class="approval-card">
                    <div class="card-header">
                        <div class="user-info">
                            <span class="user-name">User01</span>
                            <span class="date-range">出差時間段: 12/01-12/07</span>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <div class="detail-item">
                                <span class="label">本周应出<br>差天数</span>
                                <span class="value">5天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">实际<br>出差天数</span>
                                <span class="value">4天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常<br>出差天数</span>
                                <span class="value">1天</span>
                            </div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-item spacer"></div>
                            <div class="detail-item">
                                <span class="label">应打卡次数</span>
                                <span class="value">35次</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常打卡次数</span>
                                <span class="value">19次</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User 02 -->
            <div class="approval-item">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="user02">
                    <label for="user02"></label>
                </div>
                <div class="approval-card">
                    <div class="card-header">
                        <div class="user-info">
                            <span class="user-name">User02</span>
                            <span class="date-range">出差時間段: 12/01-12/07</span>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <div class="detail-item">
                                <span class="label">本周应出<br>差天数</span>
                                <span class="value">5天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">实际<br>出差天数</span>
                                <span class="value">4天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常<br>出差天数</span>
                                <span class="value">1天</span>
                            </div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-item spacer"></div>
                            <div class="detail-item">
                                <span class="label">应打卡次数</span>
                                <span class="value">40次</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常打卡次数</span>
                                <span class="value">11次</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User 03 -->
            <div class="approval-item">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="user03">
                    <label for="user03"></label>
                </div>
                <div class="approval-card">
                    <div class="card-header">
                        <div class="user-info">
                            <span class="user-name">User03</span>
                            <span class="date-range">出差時間段: 12/01-12/07</span>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="detail-row">
                            <div class="detail-item">
                                <span class="label">本周应出<br>差天数</span>
                                <span class="value">5天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">实际<br>出差天数</span>
                                <span class="value">5天</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常<br>出差天数</span>
                                <span class="value">0天</span>
                            </div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-item spacer"></div>
                            <div class="detail-item">
                                <span class="label">应打卡次数</span>
                                <span class="value">25次</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">异常打卡次数</span>
                                <span class="value">2次</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <div class="fab-container">
            <button class="fab-btn batch-approve-btn">已批阅</button>
        </div>
    </div>
</body>
</html>
