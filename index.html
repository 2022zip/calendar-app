<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>外勤打卡</title>
    <script>
        // Check authentication
        (function() {
            try {
                const currentUserStr = localStorage.getItem('currentUser');
                if (!currentUserStr) {
                    window.location.href = 'login.html';
                    return;
                }
                const currentUser = JSON.parse(currentUserStr);
                if (!currentUser || !currentUser.username) {
                    window.location.href = 'login.html';
                }
            } catch (e) {
                console.error('Auth check failed', e);
                window.location.href = 'login.html';
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=20260212-01">
    <link rel="stylesheet" href="manager.css?v=20260212-01">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <div class="date-selector">
                    <span class="year">&lt; 2024年</span>
                </div>
                <div class="header-actions">
                    <a href="check_in.html?type=check-in&source=quick" class="clock-in-btn">立即打卡</a>
                    <button id="excel-import-btn" class="excel-import-btn">EXCEL汇入日程</button>
                    <!-- Manager Buttons -->
                    <button id="dept-schedule-btn" class="dept-schedule-btn" style="display:none;">部門出勤表</button>
                    <button id="approval-btn" class="approval-btn" style="display:none;">考勤<br>審批</button>
                    
                    <span class="icon" id="search-icon">🔍</span>
                    <a href="add_event.html" id="add-event-btn" class="icon">➕</a>
                    <button id="logout-btn" style="display:none; background: none; border: none; font-size: 1.2rem; cursor: pointer;" title="登出">🚪</button>
                </div>
            </div>
            <div class="month-view">
                <span class="month">12月</span>
            </div>
        </header>

        <main>
            <div class="calendar">
                <div class="days-header">
                    <span>日</span>
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                </div>
                <div class="days-grid">
                    <!-- Calendar days will be generated by script.js -->
                </div>
            </div>

            <hr>

            <div class="schedule-list">
            </div>
        </main>

    </div>

    <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none">

    <script src="script.js"></script>
    <script src="manager_store.js"></script>
    <script src="manager_schedule_list.js"></script>
</body>
</html>
