<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>外勤打卡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <div class="date-selector">
                    <span class="year"></span>
                </div>
                <div class="header-actions">
                    <button id="attendance-btn" class="attendance-btn" style="display: none;">考勤观察</button>
                    <a href="check_in.html?type=check-in&source=quick" class="clock-in-btn">立即打卡</a>
                    <button id="excel-import-btn" class="excel-import-btn" style="display: none;">EXCEL汇入日程</button>
                    <span class="icon">🔍</span>
                    <a href="add_event.html" id="add-event-btn" class="icon">➕</a>
                </div>
            </div>
            <div class="month-view">
                <span class="month"></span>
            </div>
        </header>

        <main>
            <div class="calendar">
                <div class="days-header">
                    <span>日</span>
                    <span>一</span>
                    <span>二</span>
                    <span>三</span>
                    <span>四</span>
                    <span>五</span>
                    <span>六</span>
                </div>
                <div class="days-grid">
                    <!-- Calendar days will be generated by script.js -->
                </div>
            </div>

            <hr>

            <div class="schedule-list">
            </div>
        </main>

    </div>

    <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none">

    <script src="script.js?v=2"></script>
</body>
</html>
